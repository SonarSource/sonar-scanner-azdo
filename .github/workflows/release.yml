name: sonar-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full version including build number, e.g. 1.2.3.456'
        type: string
        required: true
      dryRun:
        description: Flag to enable the dry-run execution
        type: boolean
        default: false
      commitSha:
        type: string
        description: Commit targeted by the release. Overrides the VCS lookup on Repox.
        default: ''
        required: false

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@v7
    with:
      version: ${{ inputs.version }}
      dryRun: ${{ inputs.dryRun }}
      commitSha: ${{ inputs.commitSha }}
      publishToBinaries: true
      slackChannel: ops-ci-experience
