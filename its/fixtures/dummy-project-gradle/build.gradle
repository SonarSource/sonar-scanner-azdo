plugins {
    id 'java'
    id "org.sonarqube" version "7.3.1.8318"
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
}

test {
    useJUnitPlatform()
}
