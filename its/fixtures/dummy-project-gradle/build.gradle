plugins {
    id 'java'
    id "org.sonarqube" version "7.5.0.8588"
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.4'
}

test {
    useJUnitPlatform()
}
